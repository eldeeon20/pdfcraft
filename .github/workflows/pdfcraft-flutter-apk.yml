name: pdfcraft-flutter-apk

# Compila el APK Flutter (host + d4rt) usando el .so del core compilado
# antes por pdfcraft-core-so. Manual.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    name: host apk arm64
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter 3.38.0
        run: |
          curl -sL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.0-stable.tar.xz | tar -xJf - -C $HOME
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: flutter precache --android
        run: flutter precache --android

      - name: Crear local.properties
        run: |
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" > apps/pdfcraft_flutter/android/local.properties
          cat apps/pdfcraft_flutter/android/local.properties

      - name: flutter pub get
        working-directory: apps/pdfcraft_flutter
        run: flutter pub get

      - name: Descargar core libpdfcraft_ffi.so
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/pdfcraft-core-so.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$RUN_ID"
          rm -rf /tmp/core && mkdir -p /tmp/core
          gh run download "$RUN_ID" -R "${{ github.repository }}" -n pdfcraft-core-arm64 -D /tmp/core
          SO=$(find /tmp/core -name 'libpdfcraft_ffi.so' -type f | head -1)
          test -n "$SO"
          DEST=apps/pdfcraft_flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          cp "$SO" "$DEST/"
          ls -la "$DEST"

      - name: flutter build apk
        working-directory: apps/pdfcraft_flutter
        run: flutter build apk --release --target-platform android-arm64 -t lib/main.dart

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-flutter-arm64
          path: apps/pdfcraft_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
