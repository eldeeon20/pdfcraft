[package]
name = "pdfcraft-android"
description = "PdfCraft on Android (eframe wgpu runner via android-activity)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pdfcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "ai.storyteller.pdfcraft"
apk_name = "pdfcraft_android"
resources = "res"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 32

# When you can't be sure how to grant its files, users get a Settings toggle: opening a PDF that
# an Android version hides from the sandboxed app requires just one tap (Android 11+). No runtime
# call: the toggle is in Settings like any other app.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
version = 1
required = false

[package.metadata.android.application]
label = "PdfCraft"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
resizeable_activity = true

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
