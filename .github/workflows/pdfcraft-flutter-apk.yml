name: pdfcraft-flutter-apk

# Compila el APK Flutter (host + d4rt) usando el .so del core compilado
# antes por pdfcraft-core-so. Manual.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    name: host apk arm64
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter 3.29.0
        run: |
          curl -sL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.29.0-stable.tar.xz | tar -xJf - -C $HOME
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: flutter precache --android
        run: flutter precache --android

      - name: Crear local.properties
        run: |
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" > apps/pdfcraft_flutter/android/local.properties
          cat apps/pdfcraft_flutter/android/local.properties

      - name: flutter pub get
        working-directory: apps/pdfcraft_flutter
        run: flutter pub get

      - name: flutter build apk
        working-directory: apps/pdfcraft_flutter
        run: flutter build apk --release -t lib/main.dart

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-flutter-arm64
          path: apps/pdfcraft_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
