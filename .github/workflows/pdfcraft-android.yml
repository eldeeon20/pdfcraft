name: Android build

on:
  push:
    branches: [main, "feature/**", "android**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            name: arm64-v8a
          - target: x86_64-linux-android
            name: x86_64
          - target: armv7-linux-androideabi
            name: armeabi-v7a
          - target: i686-linux-android
            name: x86
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}

      - name: Cache the cargo-apk binary
        uses: actions/cache@v4
        id: cache-cargo-apk
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-binary-v0.10.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: Set up the Android platform and build tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-30" "build-tools;34.0.0"

      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --locked --version 0.10.0

      - name: Build the APK (release)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo apk build -p pdfcraft-android --target ${{ matrix.target }} --release

      - name: Stage the APK
        run: |
          mkdir -p dist/apk
          apk="$(find target -name '*_android*.apk' ! -name '*-unaligned.apk' | head -n 1)"
          test -n "$apk" || apk="$(find target -name '*.apk' ! -name '*-unaligned.apk' | head -n 1)"
          test -n "$apk" || { echo "No APK was built"; exit 1; }
          echo "Found APK: $apk"
          cp -v "$apk" "dist/apk/pdfcraft-android-${{ matrix.name }}.apk"
          ls -lh dist/apk/

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-android-${{ matrix.name }}-apk
          path: dist/apk/*.apk
